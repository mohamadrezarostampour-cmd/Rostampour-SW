<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import * as FS from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD3BGGIX2B104SdhML7eoxcvl3CjKGfXw4",
    authDomain: "rostampour-water-billing.firebaseapp.com",
    projectId: "rostampour-water-billing",
    storageBucket: "rostampour-water-billing.firebasestorage.app",
    messagingSenderId: "790326632020",
    appId: "1:790326632020:web:91cb2da018fc5e061717c1"
  };
  const ADMIN_EMAIL = Role.ADMIN_EMAIL;
  const fbApp = initializeApp(firebaseConfig);   // default app: shared auth session with all sections
  const fbAuth = getAuth(fbApp);
  let db;
  try {   // offline cache: reads work without internet, writes are queued and synced later
    db = FS.initializeFirestore(fbApp, { localCache: FS.persistentLocalCache({ tabManager: FS.persistentMultipleTabManager() }) });
  } catch (e) { console.warn('persistence unavailable', e); db = FS.getFirestore(fbApp); }

  window.ShellFB = { app: fbApp, auth: fbAuth, db, fs: FS, config: firebaseConfig, createUserWithEmailAndPassword, signOut };

  let loginProblem = '';
  window.ShellAuth = {
    async login(username, pass){
      const u = String(username || '').trim().toLowerCase();
      if(!/^[a-z0-9._-]{2,32}$/.test(u)) throw new Error('invalid-username');
      loginProblem = '';
      await signInWithEmailAndPassword(fbAuth, Role.emailOf(u), pass);
    },
    logout(){ return signOut(fbAuth); },
    problem(){ return loginProblem; }
  };

  function announce(user, role, profile){
    window.dispatchEvent(new CustomEvent("shell-auth-state", { detail: { user, role: role || null, profile: profile || null } }));
  }
  onAuthStateChanged(fbAuth, async (user) => {
    if(!user){ Role.clear(); announce(null); return; }
    if(user.email === ADMIN_EMAIL){ Role.set('admin', 'rostampour'); announce(user, 'admin', { username: 'rostampour', displayName: 'مدیر سامانه' }); return; }
    const uname = String(user.email || '').split('@')[0];
    try {
      const snap = await FS.getDoc(FS.doc(db, 'app_users', uname));
      const d = snap.exists() ? snap.data() : null;
      if(d && d.active !== false && (d.role === 'operator' || d.role === 'viewer')){
        Role.set(d.role, uname); announce(user, d.role, Object.assign({ username: uname }, d)); return;
      }
      loginProblem = 'disabled';
    } catch(e){
      console.error('profile load failed', e);
      // offline with a remembered role: let the user continue with the cached role
      if(!navigator.onLine && Role.get() && Role.user() === uname){ announce(user, Role.get(), { username: uname }); return; }
      loginProblem = 'profile';
    }
    Role.clear();
    announce(null);
    try { await signOut(fbAuth); } catch(e){}
  });
</script>
<style>
:root{
  --bg:#f2f8fa;
  --panel:#ffffff;
  --panel-2:#eaf4f5;
  --border:rgba(10,50,65,0.10);
  --border-strong:rgba(10,50,65,0.18);
  --text:#0f2438;
  --text-muted:#52708a;
  --text-dim:#8aa0b5;
  --teal:#00a896;
  --blue:#1565c0;
  --coral:#ff7a59;
  --amber:#f5a524;
  --violet:#7c5cff;
  --red:#d43439;
  --nav:#0b2a43;
  --nav-2:#103a5c;
  --font:'Vazirmatn','IRANSans','Tahoma','Segoe UI',sans-serif;
  --radius:14px;
}
body.dark-theme{
  --bg:#081520;
  --panel:#102a3d;
  --panel-2:#0b1f2e;
  --border:rgba(140,200,210,0.14);
  --border-strong:rgba(140,200,210,0.24);
  --text:#e8f4f7;
  --text-muted:#8db3c2;
  --text-dim:#5c7e8f;
  --teal:#19c3d8;
  --red:#ff6b70;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font); color:var(--text); overflow:hidden;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(0,168,150,0.10), transparent 60%),
    radial-gradient(900px 500px at 0% 100%, rgba(21,101,192,0.08), transparent 60%),
    var(--bg);
}
button{font-family:inherit;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:10px; border:1px solid var(--border-strong); cursor:pointer;
  font-size:13.5px; font-weight:600; transition:all .15s; color:var(--text); background:var(--panel);
}
.btn:hover{border-color:var(--teal); color:var(--teal);}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--blue)); border-color:transparent; color:#fff;}
.btn-primary:hover{filter:brightness(1.08); color:#fff;}

/* ---------- login ---------- */
.login-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
.login-card{
  width:100%; max-width:390px; background:var(--panel); border:1px solid var(--border-strong);
  border-radius:20px; padding:30px 28px; box-shadow:0 24px 70px rgba(11,42,67,0.20); text-align:center;
}
.login-logo{width:96px; height:96px; margin:0 auto 14px; border-radius:50%; background:#fff; padding:5px;
  box-shadow:0 0 0 4px rgba(0,168,150,0.18), 0 10px 26px rgba(11,42,67,0.22);}
.login-logo img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;}
.login-card h2{font-size:19px; font-weight:800; margin-bottom:4px;}
.lsub{color:var(--text-muted); font-size:12.5px; margin-bottom:20px; line-height:1.9;}
.field{margin-bottom:14px; text-align:start;}
.field label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px;}
.field input{width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-strong); background:var(--panel-2); color:var(--text); font-size:14px; font-family:inherit;}
.field input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,168,150,0.15);}
.login-error{color:var(--red); font-size:12.5px; min-height:18px; margin-bottom:6px;}
.login-tools{display:flex; gap:8px; justify-content:center; margin-bottom:16px;}
.login-tools .btn{padding:6px 12px; font-size:12px;}
.login-foot-note{margin-top:16px; font-size:11px; color:var(--text-dim);}

/* ---------- shell ---------- */
.shell{position:fixed; inset:0; display:none; flex-direction:column;}
.shell.show{display:flex;}
.topbar{
  height:60px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px;
  background:linear-gradient(135deg,var(--nav),var(--nav-2)); color:#fff;
  box-shadow:0 2px 14px rgba(11,42,67,0.25); z-index:5;
}
.topbar img.banner{height:42px; width:auto; display:block;}
.topbar .section-title{font-size:15px; font-weight:700; margin-inline-start:8px; padding-inline-start:14px; border-inline-start:1px solid rgba(255,255,255,0.25); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .spacer{flex:1;}
.tb-btn{
  height:36px; min-width:36px; padding:0 10px; border-radius:10px; cursor:pointer;
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.18); color:#fff;
  font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.tb-btn:hover{background:rgba(255,255,255,0.22);}
.tb-btn.logout{background:rgba(255,107,112,0.22); border-color:rgba(255,107,112,0.45);}
.menu-toggle{display:none;}
.body-row{flex:1; display:flex; min-height:0;}
.mode-rail{
  width:104px; flex-shrink:0; background:var(--panel); border-inline-end:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:8px; overflow-y:auto;
}
.mode-btn{
  width:88px; padding:11px 4px; border-radius:14px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  color:var(--text-muted); border:1px solid transparent; transition:all .15s; text-align:center;
}
.mode-btn .ico{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; background:var(--c);}
.mode-btn svg{width:21px; height:21px;}
.mode-btn span.lbl{font-size:10.5px; font-weight:700; line-height:1.45;}
.mode-btn:hover{background:var(--panel-2); color:var(--text);}
.mode-btn.active{background:var(--panel-2); border-color:var(--c); color:var(--text); box-shadow:0 4px 14px -6px var(--c);}
.mode-content{flex:1; position:relative; background:var(--bg); min-width:0;}
.mode-frame-wrap{position:absolute; inset:0; display:none;}
.mode-frame-wrap.active{display:block;}
.mode-frame-wrap iframe{width:100%; height:100%; border:0; display:block; background:var(--bg);}
.frame-loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--text-muted); font-size:13px; pointer-events:none;}
.spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--border-strong); border-top-color:var(--teal); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- tools: badges, panels, modals ---------- */
.tb-btn{position:relative;}
.tb-badge{position:absolute; top:-5px; inset-inline-end:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--red); color:#fff; font-size:10px; font-weight:800; display:none; align-items:center; justify-content:center; line-height:1;}
.tb-badge.show{display:inline-flex;}
.user-chip{font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:20px; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.2); white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis;}
.sync-chip{font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; display:none; white-space:nowrap;}
.sync-chip.off{display:inline-flex; background:rgba(245,165,36,0.25); border:1px solid rgba(245,165,36,0.6);}
.sync-chip.pend{display:inline-flex; background:rgba(124,92,255,0.28); border:1px solid rgba(124,92,255,0.6);}
.panel{position:fixed; top:64px; inset-inline-end:12px; width:min(410px,calc(100vw - 24px)); max-height:min(72vh,620px); background:var(--panel); color:var(--text); border:1px solid var(--border-strong); border-radius:16px; box-shadow:0 22px 60px rgba(8,30,50,0.35); z-index:60; display:none; flex-direction:column; overflow:hidden;}
.panel.show{display:flex;}
.panel-head{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px;}
.panel-head .sp{flex:1;}
.panel-body{overflow-y:auto; padding:6px;}
.al-item{display:flex; gap:10px; padding:10px; border-radius:10px; cursor:pointer; align-items:flex-start; border:1px solid transparent;}
.al-item:hover{background:var(--panel-2); border-color:var(--border);}
.al-dot{width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0; background:var(--amber);}
.al-dot.red{background:var(--red);} .al-dot.info{background:var(--blue);}
.al-txt{font-size:12.5px; line-height:1.8;} .al-sec{font-size:10.5px; color:var(--text-dim);}
.al-empty{padding:26px 10px; text-align:center; color:var(--text-muted); font-size:13px;}
.tool-overlay{position:fixed; inset:0; background:rgba(5,20,32,0.55); z-index:80; display:none; align-items:center; justify-content:center; padding:14px;}
.tool-overlay.show{display:flex;}
.tool-modal{background:var(--panel); color:var(--text); width:100%; max-width:640px; max-height:92vh; border-radius:18px; border:1px solid var(--border-strong); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.4);}
.tool-modal.wide{max-width:820px;}
.tool-head{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px;}
.tool-head .sp{flex:1;}
.tool-x{cursor:pointer; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--panel-2);}
.tool-body{padding:16px 18px; overflow-y:auto; font-size:13px; line-height:1.9;}
.tool-foot{padding:12px 18px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
.tool-body h4{font-size:13px; margin:14px 0 6px; color:var(--teal);}
.tool-body .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:10px;}
.tool-body .row > *{flex:1; min-width:130px;}
.tool-body label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:4px;}
.tool-body input[type=text],.tool-body input[type=password],.tool-body input[type=number],.tool-body select{width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border-strong); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:13px;}
.tool-body table{width:100%; border-collapse:collapse; font-size:12.5px;}
.tool-body th,.tool-body td{padding:7px 8px; border-bottom:1px solid var(--border); text-align:start;}
.tool-body th{color:var(--text-muted); font-weight:700; font-size:11.5px;}
.btn.sm{padding:6px 11px; font-size:12px;}
.btn.danger{border-color:rgba(212,52,57,0.5); color:var(--red);}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.tag{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; background:var(--panel-2); border:1px solid var(--border);}
.tag.ok{color:#1f9d76;} .tag.off{color:var(--red);}
.hint{font-size:11.5px; color:var(--text-muted); line-height:1.9; background:var(--panel-2); border:1px dashed var(--border-strong); border-radius:10px; padding:8px 11px; margin:8px 0;}
.srch-in{width:100%; padding:12px 14px; font-size:15px; border-radius:12px; border:1px solid var(--border-strong); background:var(--panel-2); color:var(--text); font-family:inherit;}
.srch-grp{font-size:11px; font-weight:800; color:var(--teal); margin:12px 0 4px;}
.srch-hit{padding:8px 10px; border-radius:9px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; border:1px solid transparent;}
.srch-hit:hover{background:var(--panel-2); border-color:var(--border);}
.srch-hit small{color:var(--text-muted);}
.tool-toast{position:fixed; bottom:20px; inset-inline-start:50%; transform:translateX(-50%); background:#0b2a43; color:#fff; padding:10px 18px; border-radius:12px; font-size:13px; z-index:99; display:none; max-width:90vw; box-shadow:0 10px 30px rgba(0,0,0,0.35);}
.tool-toast.show{display:block;}
.progress{height:8px; border-radius:6px; background:var(--panel-2); overflow:hidden; margin:8px 0;} .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--blue)); transition:width .2s;}
@media (max-width:760px){
  .user-chip{display:none;}
  .menu-toggle{display:inline-flex;}
  .topbar img.banner{height:34px;}
  .topbar .section-title{display:none;}
  .mode-rail{position:absolute; top:60px; bottom:0; inset-inline-start:0; z-index:20; transform:translateX(100%); transition:transform .2s; box-shadow:0 0 30px rgba(0,0,0,0.3);}
  html[dir="ltr"] .mode-rail{transform:translateX(-100%);}
  .mode-rail.open{transform:none !important;}
}
</style>
</head>

<script>
/* ---------------- sections ---------------- */
const MODES = [
  { id:'station',  src:'cmm.html',       color:'#1565c0', fa:'ایستگاه توزیع آب پارس', en:'Pars Water Distribution Station',
    icon:'<path d="M12 3c3.5 4.2 6 7.1 6 10a6 6 0 11-12 0c0-2.9 2.5-5.8 6-10z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/>' },

  { id:'meters',   src:'meters.html',    color:'#00a896', fa:'کنتوربرداری انشعابات', en:'Branch Meter Reading',
    icon:'<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 12l4-3.5M12 6.5v1.2M6.5 12h1.2M16.3 12h1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>' },
  { id:'sewage',   src:'sewage.html',    color:'#7c5cff', fa:'تصفیه‌خانه فاضلاب', en:'Wastewater Treatment Plant',
    icon:'<path d="M3 9c3 0 3 2 6 2s3-2 6-2 3 2 6 2M3 15c3 0 3 2 6 2s3-2 6-2 3 2 6 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>' },
  { id:'desal',    src:'desal.html',     color:'#ff7a59', fa:'کارخانه آب‌شیرین‌کن ۱', en:'Desalination Plant 1',
    icon:'<path d="M4 18h16M6 18V8h5v10M13 18v-6h5v6M8.5 5.5c0-1 1-1.5 1-2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' }
];
window.MODES = MODES;
const I18N = {
  fa:{ loginTitle:'ورود به سامانه', loginSub:'سامانه جامع آب و فاضلاب رستم‌پور', username:'نام کاربری', password:'رمز عبور',
       loginBtn:'ورود به سامانه', credit:'طراحی و توسعه‌دهنده: محمدرضا رستم‌پور', logout:'خروج',
       bad:'نام کاربری یا رمز عبور اشتباه است.', loading:'در حال بارگذاری...',
       disabled:'این حساب فعال نیست یا برای آن سطح دسترسی تعریف نشده است. با مدیر سامانه تماس بگیرید.', profile:'دریافت مشخصات کاربر ناموفق بود؛ اتصال اینترنت را بررسی کنید.' },
  en:{ loginTitle:'Sign in', loginSub:'Rostampour Integrated Water & Wastewater System', username:'Username', password:'Password',
       loginBtn:'Sign in', credit:'Designed & developed by Mohammad Reza Rostampour', logout:'Logout',
       bad:'Wrong username or password.', loading:'Loading...',
       disabled:'This account is inactive or has no access level. Contact the administrator.', profile:'Could not load the user profile — check your connection.' }
};

/* ---------------- language & theme (shared with modules) ---------------- */
let lang = 'fa';
try { lang = localStorage.getItem('rostampour-lang') || 'fa'; } catch(e){}
function T(k){ return (I18N[lang] && I18N[lang][k]) || I18N.fa[k] || k; }
function modeLabel(m){ return lang === 'en' ? m.en : m.fa; }

function broadcast(){
  document.querySelectorAll('iframe').forEach(f => {
    try { f.contentWindow.postMessage({ rostampourLang: lang, rostampourTheme: currentTheme() }, '*'); } catch(e){}
  });
}
function currentTheme(){ return document.body.classList.contains('dark-theme') ? 'dark' : 'light'; }
function setTheme(mode){
  document.body.classList.toggle('dark-theme', mode === 'dark');
  try { localStorage.setItem('rostampour-theme', mode); } catch(e){}
  broadcast();
}
function setLang(l){
  lang = l;
  try { localStorage.setItem('rostampour-lang', l); } catch(e){}
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.getElementById('langBtn').textContent = l === 'fa' ? 'EN' : 'فا';
  document.getElementById('loginLang').textContent = l === 'fa' ? 'EN' : 'فا';
  buildRail();
  updateTitle();
  broadcast();
  try { if (window.ShellTools) window.ShellTools.onLang(); } catch(e){}
}
(function initPrefs(){
  try { if (localStorage.getItem('rostampour-theme') === 'dark') document.body.classList.add('dark-theme'); } catch(e){}
})();

/* ---------------- rail & frames ---------------- */
const loaded = {};
let currentMode = 'station';
function buildRail(){
  const rail = document.getElementById('modeRail');
  rail.innerHTML = MODES.map(m => `
    <div class="mode-btn ${m.id === currentMode ? 'active' : ''}" data-mode="${m.id}" style="--c:${m.color}">
      <div class="ico"><svg viewBox="0 0 24 24">${m.icon}</svg></div>
      <span class="lbl">${modeLabel(m)}</span>
    </div>`).join('');
  rail.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => {
    activateMode(b.dataset.mode);
    rail.classList.remove('open');
  }));
}
function updateTitle(){
  const m = MODES.find(x => x.id === currentMode);
  document.getElementById('sectionTitle').textContent = m ? modeLabel(m) : '';
}
function buildFrames(){
  const c = document.getElementById('modeContent');
  c.innerHTML = MODES.map(m => `
    <div class="mode-frame-wrap" id="wrap-${m.id}">
      <div class="frame-loading" id="loading-${m.id}"><div class="spinner"></div><div>${T('loading')}</div></div>
    </div>`).join('');
}
function activateMode(id){
  currentMode = id;
  const m = MODES.find(x => x.id === id);
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === id));
  document.querySelectorAll('.mode-frame-wrap').forEach(w => w.classList.remove('active'));
  const wrap = document.getElementById('wrap-' + id);
  wrap.classList.add('active');
  if (!loaded[id]) {
    loaded[id] = true;
    const f = document.createElement('iframe');
    f.src = m.src; f.title = id;
    f.onload = () => {
      const l = document.getElementById('loading-' + id); if (l) l.remove();
      try { f.contentWindow.postMessage({ rostampourLang: lang, rostampourTheme: currentTheme() }, '*'); } catch(e){}
    };
    wrap.appendChild(f);
  }
  updateTitle();
}

/* ---------------- navigation from alerts / search ---------------- */
const pendingNav = {};
function sendNav(id){
  const w = document.getElementById('wrap-' + id), f = w && w.querySelector('iframe');
  if (!f || !pendingNav[id]) return;
  try { f.contentWindow.postMessage({ rostampourNav: pendingNav[id] }, '*'); } catch(e){}
}
function navigateTo(modeId, view, q){
  if (!MODES.find(m => m.id === modeId)) return;
  pendingNav[modeId] = { view: view || '', q: q || '', t: Date.now() };
  activateMode(modeId);
  document.getElementById('modeRail').classList.remove('open');
  sendNav(modeId);
}
window.navigateTo = navigateTo;
window.getLang = () => lang;
/* modules report their sync state (offline queue) */
const syncState = {};
function refreshSyncChip(){
  const chip = document.getElementById('syncChip');
  const pend = Object.values(syncState).some(Boolean);
  if (!navigator.onLine) { chip.className = 'sync-chip off'; chip.textContent = lang === 'fa' ? 'آفلاین' + (pend ? ' · تغییرات در صف' : '') : 'Offline' + (pend ? ' · changes queued' : ''); }
  else if (pend) { chip.className = 'sync-chip pend'; chip.textContent = lang === 'fa' ? 'در حال همگام‌سازی…' : 'Syncing…'; }
  else { chip.className = 'sync-chip'; chip.textContent = ''; }
}
window.addEventListener('online', refreshSyncChip); window.addEventListener('offline', refreshSyncChip);

/* ---------------- messages from modules (they may toggle theme/lang themselves) ---------------- */
window.addEventListener('message', ev => {
  const d = ev.data || {};
  if (d.rostampourSync) { syncState[d.rostampourSync.src || '?'] = !!d.rostampourSync.pending; refreshSyncChip(); }
  if (d.rostampourReady) { sendNav(d.rostampourReady); }
  if (d.rostampourTheme === 'light' || d.rostampourTheme === 'dark') {
    document.body.classList.toggle('dark-theme', d.rostampourTheme === 'dark');
    broadcast();
  }
  if (d.rostampourLang === 'fa' || d.rostampourLang === 'en') {
    if (d.rostampourLang !== lang) setLang(d.rostampourLang);
  }
});

/* ---------------- events ---------------- */
function toggleTheme(){ setTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }
function toggleLang(){ setLang(lang === 'fa' ? 'en' : 'fa'); }
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('loginTheme').addEventListener('click', toggleTheme);
document.getElementById('langBtn').addEventListener('click', toggleLang);
document.getElementById('loginLang').addEventListener('click', toggleLang);
document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('modeRail').classList.toggle('open'));

document.getElementById('logoutBtn').addEventListener('click', async () => {
  Object.keys(loaded).forEach(k => delete loaded[k]);
  Object.keys(pendingNav).forEach(k => delete pendingNav[k]);
  Object.keys(syncState).forEach(k => delete syncState[k]);
  try { if (window.ShellTools) window.ShellTools.stop(); } catch(e){}
  buildFrames();
  await window.ShellAuth.logout();
});

async function attemptLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try { await window.ShellAuth.login(u, p); }
  catch (e) {
    console.error(e);
    errEl.textContent = T('bad');
    document.getElementById('loginPass').value = '';
  }
}
document.getElementById('loginBtn').addEventListener('click', attemptLogin);
['loginUser','loginPass'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); }));

window.addEventListener('shell-auth-state', ev => {
  window.__lastAuth = ev.detail;
  if (ev.detail.user) {
    const rl = ev.detail.role;
    const nm = rl === 'admin' ? '' : (ev.detail.profile && (ev.detail.profile.displayName || ev.detail.profile.username) || '');
    document.getElementById('userChip').textContent = (nm ? nm + ' · ' : '') + Role.label(rl, lang === 'fa');
    document.getElementById('toolsBtn').style.display = rl === 'admin' ? '' : 'none';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('shell').classList.add('show');
    if (!loaded[currentMode]) activateMode(currentMode);
  } else {
    document.getElementById('shell').classList.remove('show');
    document.getElementById('loginScreen').style.display = 'flex';
    const pr = window.ShellAuth && window.ShellAuth.problem && window.ShellAuth.problem();
    if (pr) { document.getElementById('loginError').textContent = T(pr); }
  }
});

buildFrames();
setLang(lang);
</script>
<script type="module" src="shell-tools.js"></script>
</body>
</html>
