<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0f1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rostampour">
<link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Rostampour | سامانه جامع ایستگاه توزیع آب پارس</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD3BGGIX2B104SdhML7eoxcvl3CjKGfXw4",
    authDomain: "rostampour-water-billing.firebaseapp.com",
    projectId: "rostampour-water-billing",
    storageBucket: "rostampour-water-billing.firebasestorage.app",
    messagingSenderId: "790326632020",
    appId: "1:790326632020:web:91cb2da018fc5e061717c1"
  };
  const ROLE_MAP = {
    admin:   { email: "rostampour@rostampour-system.local", label: "مدیر سامانه" },
    station: { email: "station@rostampour-system.local",    label: "مأمور / انباردار" }
  };
  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);

  window.ShellAuth = {
    async login(username, pass){
      const email = username === "rostampour" ? ROLE_MAP.admin.email
                  : username === "station" ? ROLE_MAP.station.email
                  : null;
      if(!email) throw new Error("invalid-username");
      await signInWithEmailAndPassword(fbAuth, email, pass);
    },
    logout(){ return signOut(fbAuth); }
  };

  onAuthStateChanged(fbAuth, (user) => {
    const roleKey = user ? (user.email === ROLE_MAP.station.email ? "station" : "admin") : null;
    const label = roleKey ? ROLE_MAP[roleKey].label : null;
    window.dispatchEvent(new CustomEvent("shell-auth-state", { detail: { user, roleKey, label } }));
  });
</script>
<style>
:root{
  --bg:#0a0f1c;
  --bg-elev:#0e1526;
  --panel:#131f36;
  --panel-2:#0f1a2e;
  --border:rgba(140,170,220,0.12);
  --border-strong:rgba(140,170,220,0.22);
  --text:#e8edf7;
  --text-muted:#8ea0c2;
  --text-dim:#5d6d8c;
  --accent:#3577f5;
  --accent-2:#5b93ff;
  --accent-soft:rgba(53,119,245,0.14);
  --amber:#f2a93b;
  --amber-soft:rgba(242,169,59,0.14);
  --red:#e5484d;
  --red-soft:rgba(229,72,77,0.14);
  --green:#2fbf8f;
  --green-soft:rgba(47,191,143,0.14);
  --font: 'Vazirmatn','IRANSans','Tahoma','Segoe UI',sans-serif;
  --radius: 10px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(53,119,245,0.10), transparent 60%),
    radial-gradient(900px 500px at 0% 100%, rgba(47,191,143,0.07), transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100%;
  overflow:hidden;
}
button{font-family:inherit;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:8px; border:1px solid var(--border-strong); cursor:pointer;
  font-size:13.5px; font-weight:600; transition:all .15s; color:var(--text);
  background:var(--panel-2);
}
.btn:hover{border-color:var(--accent); color:var(--accent-2);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#2f63d6); border-color:transparent; color:#fff;}
.btn-primary:hover{filter:brightness(1.08); color:#fff;}
.btn-ghost{background:transparent;}

/* ---------------- LOGIN ---------------- */
.login-screen{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px;
}
.login-card{
  width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border-strong);
  border-radius:16px; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.45);
}
.login-logo-wrap{
  width:84px; height:84px; margin:0 auto 18px; border-radius:50%; overflow:hidden;
  box-shadow:0 0 0 4px var(--accent-soft), 0 8px 24px rgba(0,0,0,0.4);
}
.login-logo-wrap img{width:100%; height:100%; object-fit:cover;}
.login-card h2{text-align:center; font-size:19px; font-weight:700; margin-bottom:4px;}
.lsub{text-align:center; color:var(--text-muted); font-size:12.5px; margin-bottom:22px; line-height:1.8;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px;}
.field input{
  width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border-strong);
  background:var(--panel-2); color:var(--text); font-size:14px; font-family:inherit;
}
.field input:focus{outline:none; border-color:var(--accent);}
.login-error{color:var(--red); font-size:12.5px; min-height:18px; margin-bottom:6px; text-align:center;}
.login-foot-note{text-align:center; margin-top:18px; font-size:11px; color:var(--text-dim);}

/* ---------------- SHELL ---------------- */
.shell{position:fixed; inset:0; display:none;}
.shell.show{display:flex;}
.mode-rail{
  width:96px; flex-shrink:0; background:var(--bg-elev); border-inline-end:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; padding:18px 0;
}
.mode-logo{width:44px; height:44px; border-radius:50%; overflow:hidden; margin-bottom:22px; box-shadow:0 0 0 3px var(--accent-soft);}
.mode-logo img{width:100%; height:100%; object-fit:cover;}
.mode-btn{
  width:76px; padding:12px 4px; margin-bottom:10px; border-radius:12px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  color:var(--text-muted); border:1px solid transparent; transition:all .15s; text-align:center;
}
.mode-btn:hover{background:var(--panel-2); color:var(--text);}
.mode-btn.active{
  background:linear-gradient(135deg, rgba(53,119,245,.20), rgba(47,191,143,.16));
  border-color:var(--border-strong); color:#fff;
  box-shadow:inset 0 0 0 1px rgba(140,170,220,0.10);
}
.mode-btn svg{width:22px; height:22px;}
.mode-btn span{font-size:10.5px; font-weight:600; line-height:1.4;}
.mode-spacer{flex:1;}
.mode-user{
  width:76px; text-align:center; font-size:10px; color:var(--text-dim); margin-bottom:10px;
  line-height:1.6; padding:0 2px;
}
.logout-btn{
  width:76px; padding:9px 2px; border-radius:10px; cursor:pointer; text-align:center;
  color:var(--red); border:1px solid var(--red-soft); background:var(--red-soft);
  font-size:11px; font-weight:600;
}
.logout-btn:hover{filter:brightness(1.15);}
.mode-content{flex:1; position:relative; background:var(--bg);}
.mode-frame-wrap{position:absolute; inset:0; display:none;}
.mode-frame-wrap.active{display:block;}
.mode-frame-wrap iframe{width:100%; height:100%; border:0; display:block; background:var(--bg);}
.frame-loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; color:var(--text-muted); font-size:13px;
}
.spinner{
  width:34px; height:34px; border-radius:50%; border:3px solid var(--border-strong);
  border-top-color:var(--accent); animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

@media (max-width:640px){
  .mode-rail{width:74px;}
  .mode-btn, .mode-user, .logout-btn{width:58px;}
  .mode-logo{width:36px; height:36px;}
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo-wrap"><img src="icon-192.png" alt="Rostampour"></div>
    <h2>ورود به سامانه</h2>
    <div class="lsub">سامانه جامع ایستگاه توزیع آب پارس<br>نگهداری و تعمیرات &middot; انبار &middot; کنتورخوانی و صورتحساب</div>
    <div class="field">
      <label>نام کاربری</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="نام کاربری">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="رمز عبور">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; padding:12px;">ورود به سامانه</button>
    <div class="login-foot-note">طراحی و توسعه‌دهنده: محمدرضا رستم‌پور</div>
  </div>
</div>

<div class="shell" id="shell">
  <aside class="mode-rail">
    <div class="mode-logo"><img src="icon-192.png" alt="Rostampour"></div>

    <div class="mode-btn active" data-mode="cmm" id="modeBtnCmm">
      <svg viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a3.5 3.5 0 01-4.4 4.4L4 17l3 3 6.3-6.3a3.5 3.5 0 014.4-4.4l-2.6 2.6-2-2 2.6-2.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>نگهداری و<br>تعمیرات (CMM)</span>
    </div>

    <div class="mode-btn" data-mode="warehouse" id="modeBtnWarehouse">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 20V9l6 3V9l6 3V9l6 3v8H3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 20v-4M12 20v-4M17 20v-4" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>انبار</span>
    </div>

    <div class="mode-btn" data-mode="waterbilling" id="modeBtnWaterbilling">
      <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="3.5" width="12" height="17" rx="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 12h12" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>کنتورخوانی و<br>صورتحساب</span>
    </div>

    <div class="mode-spacer"></div>
    <div class="mode-user" id="modeUserLabel"></div>
    <div class="logout-btn" id="logoutBtn">خروج</div>
  </aside>

  <main class="mode-content">
    <div class="mode-frame-wrap active" id="wrapCmm">
      <div class="frame-loading" id="loadingCmm"><div class="spinner"></div><div>در حال بارگذاری ماژول CMM...</div></div>
    </div>
    <div class="mode-frame-wrap" id="wrapWarehouse">
      <div class="frame-loading" id="loadingWarehouse"><div class="spinner"></div><div>در حال بارگذاری ماژول انبار...</div></div>
    </div>
    <div class="mode-frame-wrap" id="wrapWaterbilling">
      <div class="frame-loading" id="loadingWaterbilling"><div class="spinner"></div><div>در حال بارگذاری ماژول کنتورخوانی...</div></div>
    </div>
  </main>
</div>

<script>
const MODE_SRC = { cmm: 'cmm.html', warehouse: 'warehouse.html', waterbilling: 'waterbilling.html' };
const loadedModes = {};
let currentMode = 'cmm';

function activateMode(mode){
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.mode-frame-wrap').forEach(w => w.classList.remove('active'));
  const wrap = document.getElementById('wrap' + mode.charAt(0).toUpperCase() + mode.slice(1));
  wrap.classList.add('active');
  if(!loadedModes[mode]){
    loadedModes[mode] = true;
    const iframe = document.createElement('iframe');
    iframe.src = MODE_SRC[mode];
    iframe.title = mode;
    iframe.onload = () => {
      const loading = document.getElementById('loading' + mode.charAt(0).toUpperCase() + mode.slice(1));
      if(loading) loading.remove();
    };
    wrap.appendChild(iframe);
  }
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => activateMode(btn.dataset.mode));
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  loadedModes.cmm = loadedModes.warehouse = loadedModes.waterbilling = false;
  document.querySelectorAll('.mode-frame-wrap').forEach(w => w.innerHTML = '');
  await window.ShellAuth.logout();
});

async function attemptLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    await window.ShellAuth.login(u, p);
  }catch(e){
    console.error(e);
    errEl.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
    document.getElementById('loginPass').value = '';
  }
}
document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('loginUser').addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); });
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); });

window.addEventListener('shell-auth-state', (ev) => {
  const { user, label } = ev.detail;
  if(user){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('shell').classList.add('show');
    document.getElementById('modeUserLabel').textContent = label || '';
    if(!loadedModes[currentMode]) activateMode(currentMode);
  } else {
    document.getElementById('shell').classList.remove('show');
    document.getElementById('loginScreen').style.display = 'flex';
  }
});
</script>
</body>
</html>
